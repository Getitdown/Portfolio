<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio YekaterinaKiel</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="header">
      <a href="about.html">
        <img class="logo" src="logo.png" alt="logo" height="60px" />
      </a>
      <nav class="menus">
        <a class="link" href="index.html">ABOUT ME</a>
        <a class="link" href="projects.html">MY PROJECTS</a>
        <a class="link" href="experience.html">EXPERIENCE</a>
      </nav>
      <a class="btn link-active" href="contact.html"><button>CONTACT</button></a>
    </div>

    <div class="content">
      <div class="kontaktMail">
        <h3>Contacting me</h3>
        <p class="questions">
          Feel free to check out my portfolio <br />
          and get in touch—I'd love to collaborate! <br />
        </p>
        <form
          id="contact-form"
          class="form"
          action="https://formsubmit.co/yekaterina.kiel@gmail.com"
          method="post"
          data-recaptcha-form="contact"
        >
          <div class="form__row">
            <div class="form__field">
              <label for="name" class="form__label">
                Your name <span class="form__required">*</span>
              </label>
              <input id="name" name="name" type="text" required="" />
            </div>
            <div class="form__field">
              <label for="email" class="form__label">
                Email address <span class="form__required">*</span>
              </label>
              <input id="email" name="email" type="email" required="" />
            </div>
          </div>
          <div class="form__row">
            <div class="form__field">
              <label for="subject" class="form__label">
                Subject <span class="form__required">*</span>
              </label>
              <input id="subject" name="subject" type="text" required="" />
            </div>
          </div>
          <div class="form__row">
            <div class="form__field">
              <label for="message" class="form__label">
                Your message <span class="form__required">*</span>
              </label>
              <textarea id="message" name="message" required=""></textarea>
            </div>
          </div>
          <div class="form__row">
            <div class="form__field">
              <div class="hidden">
                <input name="subject_2" type="text" />
              </div>
              <button class="btn2">Send message</button>
            </div>
          </div>
          <input
            type="hidden"
            name="_token"
            value="dIgy4kBF97EanDh5Oreshc6tX0zdXfVjUCg4QArz"
          />
        </form>
      </div>

      <img class="myFoto" src="meRund.jpg" alt="meinFoto" />
    </div>

    <div class="footer">© 2025 Yekaterina Kiel.</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
